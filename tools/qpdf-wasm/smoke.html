<!doctype html>
<meta charset="utf-8" />
<title>Interleaf qpdf WASM smoke test</title>
<pre id="output">Running…</pre>
<script type="module">
  const output = document.querySelector("#output");

  function makePdf() {
    const content = "% lossless compression smoke\n".repeat(200);
    const objects = [
      "<< /Type /Catalog /Pages 2 0 R >>",
      "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 100 100] /Contents 4 0 R >>",
      `<< /Length ${content.length} >>\nstream\n${content}endstream`,
    ];
    let pdf = "%PDF-1.4\n";
    const offsets = [0];

    objects.forEach((body, index) => {
      offsets.push(pdf.length);
      pdf += `${index + 1} 0 obj\n${body}\nendobj\n`;
    });

    const xrefOffset = pdf.length;
    pdf += `xref\n0 ${objects.length + 1}\n`;
    pdf += "0000000000 65535 f \n";
    pdf += offsets
      .slice(1)
      .map((offset) => `${String(offset).padStart(10, "0")} 00000 n \n`)
      .join("");
    pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;

    return new TextEncoder().encode(pdf);
  }

  const worker = new Worker("./qpdf-worker.js", { type: "module" });
  const input = makePdf();
  const id = "smoke";

  worker.addEventListener("message", (event) => {
    const result = event.data;
    if (result.type === "error") {
      output.textContent = `FAIL: ${result.message}`;
      return;
    }

    const bytes = new Uint8Array(result.output);
    const validHeader = new TextDecoder().decode(bytes.slice(0, 5)) === "%PDF-";
    output.textContent =
      validHeader && result.inputSize === input.byteLength && result.reduced
        ? `PASS: ${result.inputSize} bytes → ${bytes.byteLength} bytes (candidate ${result.candidateSize})`
        : "FAIL: qpdf returned an invalid smoke-test result";
    worker.terminate();
  });

  worker.postMessage({ type: "optimize", id, input: input.buffer }, [input.buffer]);
</script>
