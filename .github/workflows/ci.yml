name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-quality:
    name: bun-quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@e2088a6610d40b7c978e6e8e7ca3272be8d06020 # v0.4.0
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5

  qpdf:
    name: qpdf
    uses: ./.github/workflows/qpdf-wasm.yml
    permissions:
      contents: read

  quality:
    name: quality
    runs-on: ubuntu-latest
    if: always()
    needs: [bun-quality, dependency-review, qpdf]

    steps:
      - name: Verify required checks passed
        env:
          BUN_QUALITY_RESULT: ${{ needs.bun-quality.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QPDF_RESULT: ${{ needs.qpdf.result }}
        run: |
          if [[ "$BUN_QUALITY_RESULT" != "success" || "$DEPENDENCY_REVIEW_RESULT" != "success" || "$QPDF_RESULT" != "success" ]]; then
            echo "bun-quality: $BUN_QUALITY_RESULT"
            echo "dependency-review: $DEPENDENCY_REVIEW_RESULT"
            echo "qpdf: $QPDF_RESULT"
            exit 1
          fi
