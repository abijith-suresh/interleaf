name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: abijith-suresh/workflows/.github/workflows/ci.yml@9c9e55ab629eafe5b5edbae9857b1d66fb384f8c # 0.8.1
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@9c9e55ab629eafe5b5edbae9857b1d66fb384f8c # 0.8.1
    permissions:
      contents: read

  qpdf:
    name: qpdf
    uses: ./.github/workflows/qpdf-wasm.yml
    permissions:
      contents: read

  gate:
    name: gate
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: [ci, dependency-review, qpdf]
    permissions: {}

    steps:
      - name: Require checks to pass
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QPDF_RESULT: ${{ needs.qpdf.result }}
        run: |
          set -euo pipefail
          if [[ "$CI_RESULT" != success || "$DEPENDENCY_REVIEW_RESULT" != success || "$QPDF_RESULT" != success ]]; then
            echo "ci: $CI_RESULT" >&2
            echo "dependency-review: $DEPENDENCY_REVIEW_RESULT" >&2
            echo "qpdf: $QPDF_RESULT" >&2
            exit 1
          fi
