name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: release-please
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: abijith-suresh/workflows/.github/workflows/release-please.yml@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
