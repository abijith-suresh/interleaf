name: Clean up Vercel preview deployments

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: vercel-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup
    permissions:
      pull-requests: read
    uses: abijith-suresh/workflows/.github/workflows/vercel-preview-cleanup.yml@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0
    with:
      vercel-project: interleaf
      vercel-scope: abijiths-projects-1
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
