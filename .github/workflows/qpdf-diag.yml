name: qpdf diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.72

    steps:
      - name: Print toolchain fingerprints
        run: |
          emcc --version | head -2
          clang --version | head -2
          python3 -c 'import os; print("cpu_count", os.cpu_count()); print("affinity", len(os.sched_getaffinity(0)))'
          nproc
          echo "--- sysroot libs ---"
          sha256sum /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libz.a \
                    /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libjpeg.a \
                    /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libc++.a \
                    /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libc.a \
                    /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libc++abi.a \
                    /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libcompiler_rt.a
          echo "--- tool binaries ---"
          sha256sum /emsdk/upstream/bin/clang /emsdk/upstream/bin/wasm-ld /emsdk/upstream/bin/wasm-opt
          echo "--- system ---"
          uname -a
          head -2 /etc/os-release
          ls /emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/ | wc -l
